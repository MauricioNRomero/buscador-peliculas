<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&family=PT+Sans&family=Poppins:wght@300;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&family=PT+Sans&family=Poppins:wght@300;500;600&display=swap"
            rel="stylesheet"
        />
        <title>Buscador de Películas</title>
    </head>
    <body>
        <div class="buscador">
            <h1 class="buscador__titulo">Buscador de Películas</h1>
            <p class="buscador__subtitulo">
                Encontrá tu próxima película favorita
            </p>
            <div class="buscador__controles">
                <input
                    class="buscador__input"
                    id="input-busqueda"
                    type="text"
                    placeholder="Buscá tu película"
                />
                <button class="buscador__boton" id="btn-buscar">Buscar</button>
            </div>
            <div class="buscador__resultados" id="resultados"></div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
